name: agent-precip-bars

on:
  push:
    branches:
      - agent/meteogram-vngo-fix-20260812

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[precip-bars-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply precipitation rendering fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('meteogram_plot_weather.py')
          text = path.read_text()

          old = '''    bar_heights = display_values.copy()\n    bar_heights[trace_mask] = 0.0\n'''
          new = '''    # Keep the true intensity for trace precipitation instead of suppressing\n    # it to zero. A translucent filled column remains meteorologically\n    # proportional, while the trace marker still makes <0.1 mm/h visible.\n    bar_heights = display_values.copy()\n    axis_upper = _precipitation_axis_upper(values)\n'''
          if old not in text:
              raise SystemExit('bar height anchor not found')
          text = text.replace(old, new, 1)

          old = '''    facecolors = [to_rgba(item[2], 0.86) for item in classes]\n'''
          new = '''    # Filled semi-transparent columns are deliberately more prominent than\n    # probability curves; the latter are supporting ensemble diagnostics.\n    facecolors = [to_rgba(item[2], 0.58) for item in classes]\n'''
          if old not in text:
              raise SystemExit('facecolor anchor not found')
          text = text.replace(old, new, 1)

          old = '''    _precipitation_background(axis)\n    width = max(np.nanmedian(np.diff(x)) * 0.82, 0.015)\n'''
          new = '''    _precipitation_background(axis)\n    width = max(np.nanmedian(np.diff(x)) * 0.94, 0.015)\n'''
          if old not in text:
              raise SystemExit('bar width anchor not found')
          text = text.replace(old, new, 1)

          old = '''    axis.set_ylim(0, PRECIPITATION_RATE_CAP_MM_H)\n    axis.set_yticks(PRECIPITATION_RATE_TICKS)\n'''
          new = '''    axis.set_ylim(0, axis_upper)\n    axis.set_yticks(_precipitation_axis_ticks(axis_upper))\n'''
          if old not in text:
              raise SystemExit('precipitation ylim anchor not found')
          text = text.replace(old, new, 1)

          old = '''            probability_axis.step(\n                x,\n                probability,\n                where="mid",\n                color=color,\n                linewidth=1.15,\n                label=label,\n                zorder=5,\n            )\n'''
          new = '''            probability_axis.step(\n                x,\n                probability,\n                where="mid",\n                color=color,\n                linewidth=0.85,\n                alpha=0.72,\n                linestyle="--",\n                label=label,\n                zorder=5,\n            )\n'''
          if old not in text:
              raise SystemExit('probability line anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''\n\ndef _precipitation_background(axis) -> None:\n'''
          helper = '''\n\ndef _precipitation_axis_upper(values) -> float:\n    """Adaptive mm/h scale that keeps weak precipitation readable without exaggeration."""\n\n    finite = np.asarray(values, dtype=float)\n    finite = finite[np.isfinite(finite) & (finite > 0)]\n    if not finite.size:\n        return 2.0\n    maximum = min(float(np.nanmax(finite)), PRECIPITATION_RATE_CAP_MM_H)\n    if maximum <= 0.5:\n        return 1.0\n    if maximum <= 2.0:\n        return 2.0\n    if maximum <= 5.0:\n        return 5.0\n    if maximum <= 10.0:\n        return 10.0\n    return PRECIPITATION_RATE_CAP_MM_H\n\n\ndef _precipitation_axis_ticks(upper: float) -> tuple[float, ...]:\n    if upper <= 1.0:\n        return (0.1, 0.5, 1.0)\n    if upper <= 2.0:\n        return (0.1, 0.5, 1.0, 2.0)\n    if upper <= 5.0:\n        return (0.5, 2.0, 5.0)\n    if upper <= 10.0:\n        return (0.5, 2.0, 5.0, 10.0)\n    return PRECIPITATION_RATE_TICKS\n\n\ndef _precipitation_background(axis) -> None:\n'''
          if anchor not in text:
              raise SystemExit('helper insertion anchor not found')
          text = text.replace(anchor, helper, 1)
          path.write_text(text)

          test_path = Path('tests/test_meteogram.py')
          tests = test_path.read_text()
          old = '''        payload["hourly"]["precipitation"][1] = 0.15\n        payload["hourly"]["weather_code"][5] = 95\n'''
          new = '''        payload["hourly"]["precipitation"][1] = 0.15\n        payload["hourly"]["precipitation"][2] = 0.05\n        payload["hourly"]["weather_code"][5] = 95\n'''
          if old not in tests:
              raise SystemExit('trace fixture anchor not found')
          tests = tests.replace(old, new, 1)

          old = '''            self.assertEqual(precipitation_axis.get_ylim()[1], PRECIPITATION_RATE_CAP_MM_H)\n            self.assertNotIn(0.0, precipitation_axis.get_yticks())\n'''
          new = '''            self.assertLessEqual(precipitation_axis.get_ylim()[1], PRECIPITATION_RATE_CAP_MM_H)\n            self.assertGreaterEqual(precipitation_axis.get_ylim()[1], 1.0)\n            self.assertNotIn(0.0, precipitation_axis.get_yticks())\n'''
          if old not in tests:
              raise SystemExit('semantic ylim test anchor not found')
          tests = tests.replace(old, new, 1)

          old = '''            bars = list(precipitation_axis._meteogram_precipitation_bars)\n            self.assertEqual(bars[0].get_edgecolor()[-1], 0.0)\n'''
          new = '''            bars = list(precipitation_axis._meteogram_precipitation_bars)\n            self.assertGreater(bars[2].get_height(), 0.0)\n            self.assertLess(bars[2].get_facecolor()[-1], 1.0)\n            self.assertEqual(bars[0].get_edgecolor()[-1], 0.0)\n'''
          if old not in tests:
              raise SystemExit('bar semantics test anchor not found')
          tests = tests.replace(old, new, 1)

          old = '''            self.assertEqual(len(probability_axis.lines), 3)\n'''
          new = '''            self.assertEqual(len(probability_axis.lines), 3)\n            self.assertTrue(all(line.get_alpha() == 0.72 for line in probability_axis.lines))\n            self.assertTrue(all(line.get_linestyle() == "--" for line in probability_axis.lines))\n'''
          if old not in tests:
              raise SystemExit('probability test anchor not found')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests)

          doc_path = Path('docs/METEOGRAM.md')
          doc = doc_path.read_text()
          note = ('Осадки на панели отображаются закрашенными полупрозрачными столбиками по исходным интервалам. '
                  'Слабые значения ниже 0,1 мм/ч сохраняют истинную высоту столбика и дополнительно маркируются как следы; '
                  'шкала мм/ч адаптируется к слабым осадкам, но никогда не превышает 12 мм/ч. '
                  'Ансамблевые вероятности остаются тонкими пунктирными линиями на правой оси, чтобы не конкурировать с интенсивностью.')
          section = '## Осадки\n\n'
          if section not in doc:
              raise SystemExit('docs METEOGRAM section not found')
          if note not in doc:
              doc = doc.replace(section, section + note + '\n\n', 1)
          fixed = '''Для всех моделей используется единая шкала:\n\n```text\n0,5 · 2 · 5 · 10 · верхняя граница 12 мм/ч\n```\n\n'''
          adaptive = '''Для осадков используется адаптивная шкала `1 / 2 / 5 / 10 / 12 мм/ч`: слабые осадки занимают читаемую часть панели, а верхняя граница никогда не превышает 12 мм/ч.\n\n'''
          if fixed in doc:
              doc = doc.replace(fixed, adaptive, 1)
          old_trace = 'Значение выше 12 мм/ч визуально ограничивается, но фактическая интенсивность подписывается стрелкой. Следовые осадки менее 0,1 мм/ч показаны коротким маркером у нулевой линии, а не искусственно увеличенным столбиком.'
          new_trace = 'Значение выше 12 мм/ч визуально ограничивается, но фактическая интенсивность подписывается стрелкой. Следовые осадки менее 0,1 мм/ч сохраняют истинную высоту полупрозрачного столбика и дополнительно отмечаются коротким маркером у нулевой линии.'
          if old_trace in doc:
              doc = doc.replace(old_trace, new_trace, 1)
          doc_path.write_text(doc)

          documentation_note = ('Для метеограмм осадки рисуются закрашенными полупрозрачными столбиками по исходным интервалам; '
                                'для слабых осадков шкала интенсивности автоматически укрупняется, ансамблевые вероятности остаются тонкими пунктирными линиями.')
          for filename in ('README.md', 'TELEGRAM_BOT.md'):
              p = Path(filename)
              value = p.read_text()
              if documentation_note not in value:
                  value = value.rstrip() + '\n\n' + documentation_note + '\n'
              p.write_text(value)
          PY
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check
          python -c "import xarray, cfgrib, eccodes"
      - name: Compile and runtime check
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q .
          python runtime_check.py
      - name: Full unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests
      - name: Required GFS and meteogram smoke
        env:
          MPLBACKEND: Agg
          GFS_REQUEST_TIMEOUT: '60'
          METEOGRAM_HTTP_TIMEOUT: '90'
          METEOGRAM_HTTP_RETRIES: '3'
        run: |
          python -m gfs_core --lat 45.0355 --lon 38.9753 --lead 24
          python -m gfs_core --lat 55.75 --lon 37.62 --lead 384
          python meteogram_live_smoke.py
      - name: Commit verified rendering
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-precip-bars.yml
          git add -A
          git diff --cached --check
          git config user.name 'F2re'
          git config user.email 'f2re@users.noreply.github.com'
          git commit -m 'fix: сделать осадки метеограммы полупрозрачными столбиками [precip-bars-done]'
          git push origin HEAD:agent/meteogram-vngo-fix-20260812
