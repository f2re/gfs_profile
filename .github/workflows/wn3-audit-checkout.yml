name: WN3 audit checkout
on:
  push:
    branches: [telegram-bot]
    paths: ['.github/workflows/wn3-audit-checkout.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: telegram-bot
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare optional WN3 dependencies and official schema documentation
        run: |
          mkdir -p /tmp/wn3-zarr/wheels
          python -m pip download --only-binary=:all: --dest /tmp/wn3-zarr/wheels 'zarr>=3.1.3,<3.2' 'obstore>=0.8,<1'
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          for page in ('gcs', 'models', 'bigquery'):
              url = 'https://developers.google.com/weathernext/guides/' + page
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      Path('/tmp/wn3-zarr/' + page + '.html').write_bytes(response.read())
              except Exception as exc:
                  print(page, type(exc).__name__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wn3-zarr-dependencies
          path: /tmp/wn3-zarr/
          retention-days: 1
