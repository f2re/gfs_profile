name: WN3 audit checkout
on:
  push:
    branches: [telegram-bot]
    paths: ['.github/workflows/wn3-audit-checkout.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: telegram-bot
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare repository and offline test dependencies
        run: |
          mkdir -p /tmp/wn3-audit/wheels
          git bundle create /tmp/wn3-audit/repository.bundle --all
          python -m pip download --only-binary=:all: --dest /tmp/wn3-audit/wheels -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wn3-audit-checkout
          path: /tmp/wn3-audit/
          retention-days: 1
