name: agent-pdf-ui-review

on:
  push:
    branches:
      - agent/meteogram-pdf-ui-20260816

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply PDF UI redesign
        run: |
          python .agent/apply_pdf_ui_redesign.py
          python .agent/refine_pdf_ui.py
          python .agent/fix_eof.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check
      - name: Test report and Telegram copy
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q .
          python runtime_check.py
          python -m unittest discover -s tests
          python meteogram_report_smoke.py
      - name: Render UI samples
        env:
          MPLBACKEND: Agg
        run: python .agent/render_pdf_ui_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: meteogram-pdf-ui-samples
          path: ui_artifacts/
          if-no-files-found: error
