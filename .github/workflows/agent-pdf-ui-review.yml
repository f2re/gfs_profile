name: agent-pdf-ui-review

on:
  push:
    branches:
      - agent/meteogram-pdf-ui-20260816

permissions:
  contents: write

jobs:
  review:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-ui-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Apply PDF UI redesign
        run: |
          python .agent/apply_pdf_ui_redesign.py
          python .agent/refine_pdf_ui.py
          python .agent/fix_eof.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check
          python -c "import xarray, cfgrib, eccodes, docx, matplotlib"
      - name: Test report and Telegram copy
        env:
          MPLBACKEND: Agg
        run: |
          python -m compileall -q .
          python runtime_check.py
          python -m unittest discover -s tests
          python meteogram_report_smoke.py
      - name: Required live weather smoke
        env:
          MPLBACKEND: Agg
          GFS_REQUEST_TIMEOUT: '60'
          METEOGRAM_HTTP_TIMEOUT: '90'
          METEOGRAM_HTTP_RETRIES: '3'
        run: |
          python -m gfs_core --lat 45.0355 --lon 38.9753 --lead 24
          python -m gfs_core --lat 55.75 --lon 37.62 --lead 384
          python meteogram_live_smoke.py
      - name: Commit verified redesign
        run: |
          set -euo pipefail
          rm -rf .agent ui_artifacts
          rm -f .github/workflows/agent-pdf-ui-review.yml
          git add -A
          git diff --cached --check
          git config user.name 'F2re'
          git config user.email 'f2re@users.noreply.github.com'
          git commit -m 'fix: переработать PDF-метеограмму и тексты интерфейса [pdf-ui-done]'
          git push origin HEAD:agent/meteogram-pdf-ui-20260816
