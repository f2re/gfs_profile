name: Verify WeatherNext disabled
on:
  push:
    branches: [telegram-bot]
    paths: ['.github/workflows/disable-wn3.yml']
permissions:
  contents: read
concurrency:
  group: disable-weathernext-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MPLBACKEND: Agg
  WEATHERNEXT3_ENABLED: '0'
jobs:
  verify:
    if: github.ref == 'refs/heads/telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Apply reviewed source and remove temporary delivery files
        run: python .github/scripts/apply_disable_wn3.py
      - name: Install base only, without Google, Zarr or obstore
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          python -m pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check | tee /tmp/wn3-off/base-pip-check.log
          python -m pip freeze > /tmp/wn3-off/base-packages.txt
          python - <<'PY'
          import importlib.util
          for module in ('google.cloud.bigquery', 'zarr', 'obstore'):
              try:
                  spec = importlib.util.find_spec(module)
              except ModuleNotFoundError:
                  spec = None
              assert spec is None, f'Optional package unexpectedly installed: {module}'
          PY
      - name: Cold runtime and disabled-source flows on base dependencies
        run: |
          python runtime_check.py | tee /tmp/wn3-off/base-runtime.log
          python -m unittest discover -s tests -p test_feature_policy.py -v > /tmp/wn3-off/disabled-tests.log 2>&1
          tail -n 8 /tmp/wn3-off/disabled-tests.log
      - name: Install optional dependencies only for dormant-provider tests
        run: |
          python -m pip install --quiet --prefer-binary -r requirements-weathernext3.txt
          python -m pip check
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Full unit, contract and rendering regression suite
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v > /tmp/wn3-off/unittest.log 2>&1
          tail -n 12 /tmp/wn3-off/unittest.log
      - name: Live GFS and surface smoke with WeatherNext disabled
        if: matrix.python == '3.11'
        env:
          GFS_REQUEST_TIMEOUT: '60'
          METEOGRAM_HTTP_TIMEOUT: '90'
          METEOGRAM_HTTP_RETRIES: '3'
        run: |
          {
            python -m gfs_core --lat 45.0355 --lon 38.9753 --lead 24
            python -m gfs_core --lat 55.75 --lon 37.62 --lead 384
            python meteorology_live_smoke.py
            python meteogram_live_smoke.py
          } > /tmp/wn3-off/live-gfs-smoke.log 2>&1
          tail -n 30 /tmp/wn3-off/live-gfs-smoke.log
      - name: Verify source did not change during tests
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$(cat /tmp/wn3-off/TREE_SHA)"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disabled-wn3-py${{ matrix.python }}
          path: /tmp/wn3-off/
          retention-days: 7
          if-no-files-found: error
  commit:
    needs: verify
    if: github.ref == 'refs/heads/telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: disabled-wn3-py*
          path: /tmp/disabled-wn3-validated
      - name: Reproduce both verified source trees
        run: |
          python .github/scripts/apply_disable_wn3.py
          test "$(cat /tmp/wn3-off/TREE_SHA)" = "$(cat /tmp/disabled-wn3-validated/disabled-wn3-py3.10/TREE_SHA)"
          test "$(cat /tmp/wn3-off/TREE_SHA)" = "$(cat /tmp/disabled-wn3-validated/disabled-wn3-py3.11/TREE_SHA)"
      - name: Commit and fast-forward only the working branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/telegram-bot | cut -f1)" = "$EXPECTED_HEAD" || { echo 'Branch advanced: refusing to overwrite'; exit 1; }
          git config user.name 'gfs-profile maintenance bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: disable WeatherNext by default across all entry points'
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/wn3-off/TREE_SHA)"
          git push origin HEAD:refs/heads/telegram-bot
          test "$(git ls-remote origin refs/heads/telegram-bot | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD | tee /tmp/wn3-off/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: disabled-wn3-source-confirmation
          path: /tmp/wn3-off/
          retention-days: 7
