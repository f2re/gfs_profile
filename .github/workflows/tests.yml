name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - telegram-bot

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Runtime smoke check
        env:
          MPLBACKEND: Agg
        run: python runtime_check.py
      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: |
          set +e
          python -m unittest discover -s tests > unittest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== UNIT TEST FAILURE (tail) ====="
            tail -n 160 unittest.log
            exit "$status"
          fi
          tail -n 20 unittest.log
