name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - telegram-bot

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Runtime smoke check
        env:
          MPLBACKEND: Agg
        run: python runtime_check.py
      - name: Run unit tests
        id: unittest
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests > unittest.log 2>&1
      - name: Upload unittest log
        if: steps.unittest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-py${{ matrix.python-version }}
          path: unittest.log
          retention-days: 3
      - name: Fail on unit-test errors
        if: steps.unittest.outcome == 'failure'
        run: |
          echo "Unit tests failed on Python ${{ matrix.python-version }}; see unittest-log artifact."
          exit 1
      - name: Print unittest summary
        if: steps.unittest.outcome == 'success'
        run: tail -n 20 unittest.log

  live-gfs-smoke:
    needs: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
          python -m pip check
      - name: Run live NOMADS smoke
        id: live_smoke
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          GFS_REQUEST_TIMEOUT: '60'
        run: |
          set -o pipefail
          {
            python -m gfs_core --lat 45.0355 --lon 38.9753 --lead 24
            python -m gfs_core --lat 55.75 --lon 37.62 --lead 384
            python meteorology_live_smoke.py
          } > live-gfs-smoke.log 2>&1
      - name: Upload live-smoke log
        if: steps.live_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: live-gfs-smoke-log
          path: live-gfs-smoke.log
          retention-days: 3
      - name: Fail on live-smoke errors
        if: steps.live_smoke.outcome == 'failure'
        run: |
          echo "Live GFS smoke failed; see live-gfs-smoke-log artifact."
          exit 1
      - name: Print live-smoke summary
        if: steps.live_smoke.outcome == 'success'
        run: cat live-gfs-smoke.log
