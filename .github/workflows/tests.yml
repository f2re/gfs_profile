name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - telegram-bot

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet --prefer-binary -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Runtime smoke check
        env:
          MPLBACKEND: Agg
        run: python runtime_check.py
      - name: Run unit tests
        id: unittest
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests > unittest.log 2>&1
      - name: Upload unittest log
        if: steps.unittest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log
          path: unittest.log
          retention-days: 3
      - name: Fail on unit-test errors
        if: steps.unittest.outcome == 'failure'
        run: |
          echo "Unit tests failed; see unittest-log artifact."
          exit 1
      - name: Print unittest summary
        if: steps.unittest.outcome == 'success'
        run: tail -n 20 unittest.log
